name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      # 使用官方 actions/upload-artifact 保存測試覆蓋率報告
      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/

  e2e:
    name: E2E Tests with Playwright
    runs-on: ubuntu-24.04 # 固定 Ubuntu 24.04，避免 ubuntu-latest (26.04) 與 Playwright 1.58.2 不相容
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      # 關鍵特性：archive: false 達成免解壓直接網頁預覽
      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          path: playwright-report/index.html
          archive: false